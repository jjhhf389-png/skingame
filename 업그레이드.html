<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>내 피부의 위험신호를 찾아라!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
    :root{
        /* ---- design tokens ---- */
        --bg: #EFF5F8;
        --bg-line: rgba(20, 61, 82, 0.05);
        --ink: #163647;
        --ink-soft: #4C6473;
        --paper: #FFFFFF;
        --line: #DCE6EC;

        --primary: #1F6E8C;
        --primary-deep: #123B4E;
        --primary-tint: #E4F0F5;

        --danger: #C1443F;
        --danger-tint: #FBEBE9;
        --danger-line: #E7B4B0;

        --safe: #2E8B6B;
        --safe-tint: #E9F5EF;
        --safe-line: #B6DFCB;

        --gold: #D99A3D;
        --gold-tint: #FDF3E2;

        --radius-lg: 26px;
        --radius-md: 18px;
        --radius-sm: 12px;

        --shadow-card: 0 2px 6px rgba(18, 59, 78, 0.06), 0 14px 30px rgba(18, 59, 78, 0.10);
        --shadow-pop: 0 24px 60px rgba(18, 59, 78, 0.28);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
    }

    html, body { height: 100%; }

    body {
        font-family: 'Pretendard Variable', 'Pretendard', 'Malgun Gothic', sans-serif;
        color: var(--ink);
        background:
            linear-gradient(180deg, #F6FAFC 0%, var(--bg) 100%);
        background-image:
            linear-gradient(var(--bg-line) 1px, transparent 1px),
            linear-gradient(90deg, var(--bg-line) 1px, transparent 1px),
            linear-gradient(180deg, #F6FAFC 0%, var(--bg) 100%);
        background-size: 42px 42px, 42px 42px, 100% 100%;
        text-align: center;
        width: 100vw;
        min-height: 100vh;
        overflow-y: auto !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px 30px;
    }

    .display { font-family: 'Gmarket Sans', 'Malgun Gothic', sans-serif; }

    /* ---------------- [대기 화면] ---------------- */
    .intro-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        max-width: 1100px;
        width: 100%;
        animation: fadeUp 0.7s ease-out;
    }

    .hospital-logo {
        width: min(38%, 220px);
        height: auto;
        margin-top: 36px;
        opacity: 0.9;
    }

    .intro-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        background: var(--paper);
        border: 2px solid var(--primary-tint);
        box-shadow: var(--shadow-card);
        justify-content: center;
        margin-bottom: 28px;
        position: relative;
    }
    .intro-badge::after{
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px dashed var(--danger-line);
        opacity: .6;
    }
    .intro-badge svg { width: 56px; height: 56px; }

    .intro-eyebrow{
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: .1em;
        color: var(--danger);
        text-transform: uppercase;
        margin-bottom: 16px;
    }

    .intro-title {
        color: var(--primary-deep);
        font-size: clamp(1.9rem, 5vw, 3.4rem);
        font-weight: 700;
        margin-bottom: 22px;
        line-height: 1.35;
        white-space: nowrap;
    }
    .intro-title .accent{ color: var(--danger); }

    .intro-subtitle {
        font-size: 1.85rem;
        font-weight: 500;
        color: var(--ink-soft);
        line-height: 1.75;
        margin-bottom: 44px;
        word-break: keep-all;
    }

    .start-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: var(--primary);
        color: white;
        border: none;
        padding: 26px 58px;
        font-family: 'Pretendard Variable', sans-serif;
        font-size: 1.9rem;
        font-weight: 700;
        border-radius: 60px;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(31, 110, 140, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .start-btn svg{ width: 28px; height: 28px; }
    .start-btn:active {
        transform: scale(0.96);
        box-shadow: 0 6px 16px rgba(31, 110, 140, 0.3);
    }

    /* ---------------- [게임 진행 화면] ---------------- */
    .game-area {
        display: none;
        width: 100%;
        max-width: 1280px;
        flex-direction: column;
        animation: fadeUp 0.5s ease-out;
    }

    .header-area {
        flex-shrink: 0;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .header-title{
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .header-title svg{ width: 22px; height: 22px; flex-shrink: 0; }

    .score-board {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--primary-deep);
        background: var(--paper);
        padding: 8px 26px;
        border-radius: 40px;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--line);
    }
    .score-board .num { color: var(--danger); font-size: 1.55rem; }

    .progress-track{
        width: 240px;
        height: 12px;
        border-radius: 10px;
        background: var(--primary-tint);
        overflow: hidden;
        border: 1px solid var(--line);
    }
    .progress-fill{
        height: 100%;
        width: 0%;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--primary), var(--danger));
        transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    .grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        width: 100%;
        margin: 0 auto;
        padding-bottom: 20px;
    }

    .card-container {
        perspective: 1600px;
        width: 100%;
        height: 300px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--paper);
    }

    /* 앞면 */
    .card-front {
        z-index: 2;
        transform: rotateY(0deg);
        border: 1px solid var(--line);
    }

    .image-container {
        width: 100%;
        height: 100%;
        position: relative;
        background-color: #E7EEF1;
    }

    .image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0; left: 0;
        filter: saturate(1.02);
    }

    .image-container::after{
        content:'';
        position:absolute;
        left:0; right:0; bottom:0;
        height: 46%;
        background: linear-gradient(180deg, rgba(18,59,78,0) 0%, rgba(18,59,78,0.55) 100%);
        pointer-events: none;
    }

    .card-title {
        position: absolute;
        bottom: 16px;
        left: 16px;
        max-width: calc(100% - 32px);
        background: rgba(255,255,255,0.97);
        padding: 10px 22px;
        font-weight: 700;
        font-size: 1.45rem;
        color: var(--primary-deep);
        text-align: center;
        z-index: 3;
        border-radius: 30px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .tap-hint{
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 18px 9px 14px;
        border-radius: 30px;
        background: var(--primary);
        box-shadow: 0 4px 12px rgba(18,59,78,0.35);
        animation: hintPulse 1.6s ease-in-out infinite;
    }
    .tap-hint svg{ width: 22px; height: 22px; color: white; flex-shrink: 0; }
    .tap-hint span{
        color: white;
        font-size: 1.05rem;
        font-weight: 700;
        white-space: nowrap;
    }

    @keyframes hintPulse{
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    /* 뒷면 */
    .card-back {
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        text-align: left;
        padding: 22px 26px;
        position: relative;
        overflow-y: auto; /* safety net: if text is ever too long for the card, it scrolls instead of being invisibly clipped */
    }

    .card-back.correct { border: 5px solid var(--danger); }
    .card-back.wrong { border: 5px solid var(--safe); }

    .back-icon{
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        flex-shrink: 0;
    }
    .back-icon svg{ width: 28px; height: 28px; }

    .back-result {
        font-size: 1.55rem;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .back-desc {
        font-size: 1.4rem;
        line-height: 1.6;
        color: var(--ink);
        font-weight: 500;
        word-break: keep-all;
    }

    .card-back.correct .back-icon{ background: var(--danger-tint); }
    .card-back.correct .back-icon svg{ color: var(--danger); }
    .card-back.correct .back-result { color: var(--danger); }

    .card-back.wrong .back-icon{ background: var(--safe-tint); }
    .card-back.wrong .back-icon svg{ color: var(--safe); }
    .card-back.wrong .back-result { color: var(--safe); }

    /* 축하 팝업 */
    .success-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 38, 51, 0.55);
        backdrop-filter: blur(4px);
        z-index: 999;
    }

    .success-popup {
        display: none;
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.7);
        background-color: var(--paper);
        border-radius: 30px;
        padding: 44px 38px 38px;
        width: 86%;
        max-width: 560px;
        box-shadow: var(--shadow-pop);
        z-index: 1000;
        text-align: center;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .success-popup::before{
        content:'';
        position:absolute;
        top:0; left:0; right:0;
        height: 8px;
        border-radius: 30px 30px 0 0;
        background: linear-gradient(90deg, var(--primary), var(--gold), var(--danger));
    }

    .success-popup.show {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

    .success-icon {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        background: var(--gold-tint);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 4px auto 20px;
        animation: bounce 1s infinite alternate;
    }
    .success-icon svg{ width: 54px; height: 54px; color: var(--gold); }

    .success-title {
        color: var(--primary-deep);
        font-size: 2.4rem;
        font-weight: 700;
        margin-bottom: 18px;
    }

    .success-text {
        font-size: 1.5rem;
        line-height: 1.75;
        color: var(--ink-soft);
        font-weight: 500;
        margin-bottom: 36px;
        word-break: keep-all;
    }
    .success-text strong{ color: var(--ink); }

    .success-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary);
        color: white;
        border: none;
        padding: 20px 48px;
        font-family: 'Pretendard Variable', sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        border-radius: 60px;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(31, 110, 140, 0.35);
        transition: transform 0.2s;
    }
    .success-btn:active { transform: scale(0.95); }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-10px); }
    }

    .confetti {
        position: fixed;
        width: 12px;
        height: 12px;
        z-index: 1001;
        border-radius: 3px;
        pointer-events: none;
        animation: fall linear forwards;
    }

    @keyframes fall {
        0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 520px){
        .intro-subtitle{ font-size: 1.4rem; }
        .card-container{ height: 300px; }
        .card-title{ font-size: 1.4rem; }
        .back-desc{ font-size: 1.15rem; }
    }
</style>
</head>

        let score = 0;
        const totalDanger = skinData.filter(item => item.isDanger).length;
        const grid = document.getElementById('grid');
        const scoreSpan = document.getElementById('score');
        const progressFill = document.getElementById('progress-fill');

        document.getElementById('total-count').textContent = totalDanger;

        const alertIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
        const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
        const tapIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V6a2 2 0 114 0v5.5"></path><path d="M13 6a2 2 0 114 0v6"></path><path d="M17 8.5a2 2 0 114 0V13a7 7 0 01-7 7h-1a7 7 0 01-6-3.4l-2-3.4a1.8 1.8 0 013-1.9l1 1.4"></path></svg>`;

        skinData.forEach(item => {
            const container = document.createElement('div');
            container.className = 'card-container';

            const card = document.createElement('div');
            card.className = 'card';

            const frontFace = `
                <div class="card-face card-front">
                    <div class="image-container">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="tap-hint">${tapIcon}<span>터치</span></div>
                    <div class="card-title">${item.name}</div>
                </div>
            `;

            const backFaceColorClass = item.isDanger ? 'correct' : 'wrong';
            const backResultText = item.isDanger ? '위험 신호 발견!' : '안전해요!';
            const backIconSvg = item.isDanger ? alertIcon : checkIcon;

            const backFace = `
                <div class="card-face card-back ${backFaceColorClass}">
                    <div class="back-icon">${backIconSvg}</div>
                    <div class="back-result">${backResultText}</div>
                    <div class="back-desc">${item.desc}</div>
                </div>
            `;

            card.innerHTML = frontFace + backFace;

            card.addEventListener('click', () => {
                if (card.classList.contains('flipped')) return;

                card.classList.add('flipped');

                if (item.isDanger) {
                    score++;
                    scoreSpan.textContent = score;
                    progressFill.style.width = (score / totalDanger * 100) + '%';
                }

                if (score === totalDanger) {
                    setTimeout(() => {
                        showSuccessPopup();
                    }, 800);
                }
            });

            container.appendChild(card);
            grid.appendChild(container);
        });

        function startGame() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSuccessPopup() {
            const overlay = document.getElementById('success-overlay');
            const popup = document.getElementById('success-popup');

            overlay.style.display = 'block';
            popup.style.display = 'block';

            setTimeout(() => {
                popup.classList.add('show');
            }, 50);

            for (let i = 0; i < 120; i++) {
                createConfetti();
            }
        }

        function closeSuccessPopup() {
            const popup = document.getElementById('success-popup');
            popup.classList.remove('show');

            setTimeout(() => {
                location.reload();
            }, 300);
        }

        function createConfetti() {
            const colors = ['#1F6E8C', '#D99A3D', '#C1443F', '#2E8B6B', '#E4F0F5'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';

            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.top = -Math.random() * 20 - 10 + 'px';

            const size = Math.random() * 8 + 6 + 'px';
            confetti.style.width = size;
            confetti.style.height = size;

            const duration = Math.random() * 2 + 2 + 's';
            confetti.style.animationDuration = duration;

            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, parseFloat(duration) * 1000);
        }
    </script>
</body>
</html>
